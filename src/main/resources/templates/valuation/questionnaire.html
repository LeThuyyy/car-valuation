<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>Bước 5: Bảng Hỏi Tình Trạng Xe - Car Valuation AI</title>
</head>
<body>
<div id="main-content">
    <div class="container py-4">
        <!-- Wizard Stepper -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-8">
                <div class="wizard-progress">
                    <div class="wizard-step completed" title="Bước 1: Quét VIN"><i class="bi bi-check"></i></div>
                    <div class="wizard-step completed" title="Bước 2: Thông tin xe"><i class="bi bi-check"></i></div>
                    <div class="wizard-step completed" title="Bước 3: Quét ODO"><i class="bi bi-check"></i></div>
                    <div class="wizard-step completed" title="Bước 4: Ngoại thất"><i class="bi bi-check"></i></div>
                    <div class="wizard-step active" title="Bước 5: Định giá">5</div>
                </div>
                <div class="d-flex justify-content-between text-muted small px-1">
                    <span class="text-success fw-bold">1. Quét VIN</span>
                    <span class="text-success fw-bold">2. Thông tin xe</span>
                    <span class="text-success fw-bold">3. Quét ODO</span>
                    <span class="text-success fw-bold">4. Ngoại thất</span>
                    <span class="text-primary fw-bold">5. Bảng hỏi &amp; Tính giá</span>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-2 me-3">
                            <i class="bi bi-clipboard-check fs-4"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0">Bước 5: Bảng Hỏi Tình Trạng Kỹ Thuật &amp; Bảo Dưỡng</h4>
                            <small class="text-muted">Các thông tin thực tế giúp thuật toán Java Pricing Engine định giá chính xác nhất</small>
                        </div>
                    </div>

                    <form th:action="@{'/valuation/' + ${session.id} + '/evaluate'}" method="post">
                        <!-- Lịch sử bảo dưỡng -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-tools text-primary me-1"></i> 1. Lịch sử bảo dưỡng định kỳ</label>
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="maintenance" id="m_full" value="FULL_DEALER" checked>
                                    <label class="btn btn-outline-success w-100 p-3 text-start h-100" for="m_full">
                                        <div class="fw-bold">Chính Hãng 100%</div>
                                        <small class="text-muted d-block">Đầy đủ sổ bảo dưỡng hãng, bảo hiểm bảo hành chuẩn</small>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="maintenance" id="m_regular" value="REGULAR">
                                    <label class="btn btn-outline-primary w-100 p-3 text-start h-100" for="m_regular">
                                        <div class="fw-bold">Bảo Dưỡng Gara Uy Tín</div>
                                        <small class="text-muted d-block">Thay dầu và bảo dưỡng định kỳ tại gara ngoài</small>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="maintenance" id="m_poor" value="POOR">
                                    <label class="btn btn-outline-secondary w-100 p-3 text-start h-100" for="m_poor">
                                        <div class="fw-bold">Ít Bảo Dưỡng</div>
                                        <small class="text-muted d-block">Không bảo dưỡng thường xuyên, chỉ thay dầu khi nhớ</small>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Tình trạng lốp xe -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-disc text-primary me-1"></i> 2. Tình trạng dàn lốp xe</label>
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="tires" id="t_new" value="NEW">
                                    <label class="btn btn-outline-success w-100 p-3 text-start h-100" for="t_new">
                                        <div class="fw-bold">Lốp Mới Thay</div>
                                        <small class="text-muted d-block">Date lốp gần, gai lốp dày 90-100%</small>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="tires" id="t_good" value="GOOD" checked>
                                    <label class="btn btn-outline-primary w-100 p-3 text-start h-100" for="t_good">
                                        <div class="fw-bold">Lốp Còn Tốt</div>
                                        <small class="text-muted d-block">Đi tiếp 20.000 - 30.000 km không cần thay</small>
                                    </label>
                                </div>
                                <div class="col-md-4">
                                    <input type="radio" class="btn-check" name="tires" id="t_worn" value="WORN">
                                    <label class="btn btn-outline-danger w-100 p-3 text-start h-100" for="t_worn">
                                        <div class="fw-bold">Lốp Mòn / Cũ</div>
                                        <small class="text-muted d-block">Gai lốp mòn, nứt chân chim, cần thay sớm</small>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Thời hạn đăng kiểm -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-calendar-check text-primary me-1"></i> 3. Thời hạn đăng kiểm &amp; Phí đường bộ còn lại</label>
                            <select class="form-select form-select-lg" name="registrationMonths">
                                <option value="18">Còn dài (Trên 12 tháng)</option>
                                <option value="8" selected>Bình thường (6 đến 12 tháng)</option>
                                <option value="2">Sắp hết hạn (Dưới 3 tháng)</option>
                            </select>
                        </div>

                        <!-- Tình trạng nội thất -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-person-workspace text-primary me-1"></i> 4. Tình trạng nội thất &amp; Vệ sinh xe</label>
                            <select class="form-select" name="interiorCondition">
                                <option value="EXCELLENT" selected>Rất đẹp: Ghế da căng bóng, không mùi, điều hòa mát sâu</option>
                                <option value="GOOD">Khá tốt: Hao mòn nhẹ tự nhiên theo năm tháng</option>
                                <option value="FAIR">Trung bình: Ghế sờn rách nhẹ, cần vệ sinh dọn dẹp</option>
                            </select>
                        </div>

                        <!-- Trang bị phụ kiện nâng cấp thêm -->
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-plus-square text-primary me-1"></i> 5. Phụ kiện đã nâng cấp (Tùy chọn)</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasDashcam" id="f_cam" checked>
                                    <label class="form-check-label" for="f_cam">Camera hành trình</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasTint" id="f_tint" checked>
                                    <label class="form-check-label" for="f_tint">Phim cách nhiệt cao cấp</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasScreen" id="f_screen">
                                    <label class="form-check-label" for="f_screen">Màn hình Android / CarPlay</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hasTpms" id="f_tpms">
                                    <label class="form-check-label" for="f_tpms">Cảm biến áp suất lốp</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{'/valuation/' + ${session.id} + '/photos'}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Quay Lại Bước 4
                            </a>
                            <button type="submit" class="btn btn-success btn-lg fw-bold px-4 shadow">
                                <i class="bi bi-calculator me-1"></i> Tính Toán &amp; Xuất Báo Cáo Định Giá
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
