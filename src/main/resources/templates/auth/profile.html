<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#main-content})}">
<head>
    <title>Hồ sơ cá nhân - Car Valuation AI</title>
</head>
<body>
<div id="main-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3">
                            <i class="bi bi-person-badge fs-2"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold mb-1" th:text="${user.fullName != null ? user.fullName : user.username}">Nguyễn Văn A</h3>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-primary" th:text="${user.role}">USER</span>
                                <small class="text-muted">Tham gia: <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></small>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small mb-1">Tên đăng nhập</label>
                            <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small mb-1">Email</label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small mb-1">Họ và tên</label>
                            <input type="text" class="form-control bg-light" th:value="${user.fullName}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small mb-1">Số điện thoại</label>
                            <input type="text" class="form-control bg-light" th:value="${user.phone}" readonly>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-top d-flex gap-2">
                        <a th:href="@{/history}" class="btn btn-primary">
                            <i class="bi bi-clock-history me-1"></i>Xem lịch sử định giá của tôi
                        </a>
                        <a th:href="@{/valuation/start}" class="btn btn-warning fw-semibold">
                            <i class="bi bi-plus-circle me-1"></i>Tạo phiên định giá mới
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
