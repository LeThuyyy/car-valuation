# Production requires a persistent MySQL database and a durable, backed-up upload volume.
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
app.storage.upload-dir=${UPLOAD_DIR}
gemini.api.key=${GEMINI_API_KEY}
gemini.api.mock-mode=false
# Only enable forwarded headers behind a trusted HTTPS reverse proxy that overwrites them.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
