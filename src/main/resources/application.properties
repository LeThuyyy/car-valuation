# ===================================================================
# CAR VALUATION AI - APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=car-valuation
server.port=8080

# -------------------------------------------------------------------
# DATABASE CONFIGURATION: H2 Embedded (Default for quick test/run)
# Để chuyển sang MySQL, chạy: java -jar app.jar --spring.profiles.active=mysql
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:carvaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# THYMELEAF & STATIC ASSETS
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# FILE STORAGE CONFIGURATION
# -------------------------------------------------------------------
app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------------------------------------------------
# GEMINI AI VISION & MARKET RESEARCH CONFIGURATION
# Bạn có thể điền Gemini API Key của mình vào đây hoặc đặt biến môi trường GEMINI_API_KEY
# Nếu để trống, hệ thống tự động kích hoạt Mock AI thông minh để test toàn bộ luồng!
# -------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.vision-model=gemini-1.5-flash
gemini.api.text-model=gemini-1.5-flash
gemini.api.mock-mode=false

# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------
logging.level.com.carvaluation=INFO
logging.level.org.springframework.security=WARN
